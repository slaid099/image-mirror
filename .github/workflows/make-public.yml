name: Make package public

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name under the user account
        required: true
        default: article-gen

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/$PACKAGE" \
            -d '{"visibility":"public"}' \
            -o response.json -w "http %{http_code}\n"
          cat response.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/user/packages/container/$PACKAGE")" = "200"
