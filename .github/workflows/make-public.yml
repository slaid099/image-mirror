name: Make package public

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name under the user account
        required: true
        default: article-gen

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          api="https://api.github.com/user/packages/container/$PACKAGE"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "before:"
          curl -sS "${auth[@]}" "$api" | jq -r '.name, .visibility, .owner.login, .owner.type'
          code=$(curl -sS -X PATCH "${auth[@]}" -H "Content-Type: application/json" \
            "$api" -d '{"visibility":"public"}' -o patch.json -w '%{http_code}')
          echo "patch http $code"
          cat patch.json; echo
          echo "after:"
          curl -sS "${auth[@]}" "$api" | jq -r '.visibility'
          test "$(curl -sS "${auth[@]}" "$api" | jq -r '.visibility')" = "public"
