name: Test GHCR push (PAT check)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR (PAT)
        run: docker login ghcr.io -u slaid099 -p ${{ secrets.GHCR_PAT }}

      - name: Build dummy image
        run: docker build -t ghcr.io/slaid099/image-gen:latest -f- . <<'EOF'
FROM alpine:latest
RUN echo "test"
EOF

      - name: Push to GHCR
        run: docker push ghcr.io/slaid099/image-gen:latest

      - name: Cleanup (delete pushed tag to not pollute)
        run: echo "push done - will overwrite later with real build"